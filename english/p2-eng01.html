<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>P2 Nouns & Articles</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@600;700;800&family=Atkinson+Hyperlegible:wght@400;700&display=swap">
<style>
/* Layout: a chunky picture-book "stage" card with Chowdie's speech bubble below, big round controls for small fingers.
   Deliberately one bright light world (a children's picture book), so colours are set explicitly for every host theme. */
:root{
  color-scheme:light;
  --bg:#D9F0EA; --paper:#FFFDF6; --paper2:#F3F8F1; --ink:#1F3A4A; --muted:#58707D; --line:#B7D8CF;
  --accent:#FF7A45; --accent-ink:#B9471A; --sun:#FFC83D; --sky:#5BB8E8; --leaf:#4FAE63; --berry:#E5577A; --grape:#8E6BD8;
  --good:#3EA45A; --bad:#E0574F;
  --display:"Baloo 2","Trebuchet MS","Arial Rounded MT Bold",system-ui,sans-serif;
  --body:"Atkinson Hyperlegible",Verdana,system-ui,sans-serif;
}
html,body{background:var(--bg);color:var(--ink)}
body{font-family:var(--body);font-size:17px;line-height:1.5;
  background-image:radial-gradient(circle at 12px 12px, rgba(31,58,74,.07) 2px, transparent 2.5px);background-size:26px 26px}
.wrap{max-width:860px;margin:0 auto;padding-inline:16px;padding-block:18px 36px;display:flex;flex-direction:column;gap:14px}
header{display:flex;align-items:flex-end;justify-content:space-between;gap:12px;flex-wrap:wrap}
.eyebrow{margin:0;font-family:var(--display);font-weight:700;font-size:14px;letter-spacing:.08em;text-transform:uppercase;color:var(--accent-ink)}
h1{margin:0;font-family:var(--display);font-weight:800;font-size:clamp(30px,6vw,44px);line-height:1.05;text-wrap:balance}
.starpill{display:flex;align-items:center;gap:6px;font-family:var(--display);font-weight:800;font-size:20px;background:var(--paper);
  border:3px solid var(--ink);border-radius:999px;padding:2px 14px 0 8px;box-shadow:0 4px 0 var(--ink)}
.starpill svg{width:26px;height:26px;margin-top:-2px}
.starpill.bump{animation:bump .5s ease}
@keyframes bump{40%{transform:scale(1.25) rotate(-6deg)}}
.parts{display:flex;gap:8px;flex-wrap:wrap}
.parts button{font-family:var(--display);font-weight:700;font-size:16px;padding:6px 16px 4px;border-radius:999px;border:3px solid var(--ink);
  background:var(--paper);color:var(--ink);cursor:pointer}
.parts button[aria-current="true"]{background:var(--ink);color:var(--paper)}
.stage{background:var(--paper);border:3px solid var(--ink);border-radius:26px;box-shadow:0 7px 0 var(--ink);padding:14px 14px 12px;
  display:flex;flex-direction:column;gap:10px;position:relative}
.scene-head{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.tag{font-family:var(--display);font-weight:800;font-size:13px;letter-spacing:.06em;text-transform:uppercase;color:#fff;
  padding:3px 11px 1px;border-radius:8px;background:var(--sky)}
.tag.try{background:var(--leaf)} .tag.check{background:var(--accent)}
h2{margin:0;font-family:var(--display);font-weight:800;font-size:clamp(22px,4.4vw,30px);line-height:1.1;text-wrap:balance}
#stage{display:block;width:100%;height:auto;border-radius:16px;background:var(--paper2);font-family:var(--display);user-select:none;-webkit-user-select:none}
.ui{display:flex;gap:10px;flex-wrap:wrap;justify-content:center}
.ui:empty{display:none}
.ui button{font-family:var(--display);font-weight:800;font-size:22px;min-width:64px;padding:8px 18px 4px;border-radius:16px;border:3px solid var(--ink);
  background:#fff;color:var(--ink);cursor:pointer;box-shadow:0 4px 0 var(--ink);transition:transform .08s}
.ui button:active{transform:translateY(3px);box-shadow:0 1px 0 var(--ink)}
.ui button.ok{background:var(--good);color:#fff}
.ui button.no{background:var(--bad);color:#fff;animation:shake .4s}
.ui button.go{background:var(--sun)}
.ui button:disabled{cursor:default}
@keyframes shake{25%{transform:translateX(-6px)}75%{transform:translateX(6px)}}
.talk{display:grid;grid-template-columns:58px 1fr;gap:10px;align-items:start}
.talk svg{width:58px;height:58px}
.bubble{position:relative;background:#fff;border:3px solid var(--ink);border-radius:18px;padding:10px 14px;min-width:0;font-size:18px}
.bubble::before{content:"";position:absolute;left:-13px;top:16px;border:10px solid transparent;border-right-color:var(--ink)}
.bubble::after{content:"";position:absolute;left:-8px;top:18px;border:8px solid transparent;border-right-color:#fff}
.bubble b{color:var(--accent-ink)}
.controls{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.controls button{font-family:var(--display);font-weight:800;font-size:18px;padding:9px 18px 5px;border-radius:999px;border:3px solid var(--ink);
  background:var(--paper);color:var(--ink);cursor:pointer;box-shadow:0 4px 0 var(--ink)}
.controls button.primary{background:var(--accent);color:#fff}
.controls button:disabled{opacity:.35;cursor:default;box-shadow:none}
.controls button[aria-pressed="true"]{background:var(--sun)}
.dots{display:flex;gap:6px;flex:1;justify-content:center;flex-wrap:wrap;min-width:0}
.dots button{width:13px;height:13px;padding:0;border-radius:50%;border:2px solid var(--ink);background:var(--paper);cursor:pointer;box-shadow:none}
.dots button.try{border-radius:3px} .dots button.check{transform:rotate(45deg);border-radius:2px}
.dots button[aria-current="true"]{background:var(--accent)}
.dots button.done{background:var(--sun)}
button:focus-visible{outline:3px solid var(--sky);outline-offset:3px}
.foot{font-size:14px;color:var(--muted);margin:0}
@media (max-width:520px){ .controls .rd span{display:none} .bubble{font-size:16px} }

/* SVG classes */
#stage text{font-family:var(--display);font-weight:700;fill:var(--ink)}
#stage .mid{text-anchor:middle} #stage .end{text-anchor:end}
#stage .big{font-size:44px;font-weight:800} #stage .h{font-size:28px;font-weight:800} #stage .lab{font-size:20px} #stage .sm{font-size:15px}
#stage .mut{fill:var(--muted)} #stage .acc{fill:var(--accent-ink)} #stage .wht{fill:#fff}
#stage .tap{cursor:pointer}
#stage .tap:hover{filter:brightness(1.05)}
.a-pop{animation:pop .55s cubic-bezier(.2,.8,.3,1.4) both;animation-delay:var(--d,0s);transform-box:fill-box;transform-origin:center}
.a-fade{animation:fade .5s ease-out both;animation-delay:var(--d,0s)}
.a-drop{animation:drop .65s cubic-bezier(.3,.7,.3,1.2) both;animation-delay:var(--d,0s)}
.a-grow{animation:grow .8s ease-out both;animation-delay:var(--d,0s);transform-box:fill-box;transform-origin:left center}
.a-rise{animation:rise .8s ease-out both;animation-delay:var(--d,0s);transform-box:fill-box;transform-origin:bottom center}
.a-bob{animation:bob 2.4s ease-in-out infinite;transform-box:fill-box}
.a-wig{animation:wig 1.2s ease-in-out infinite;transform-box:fill-box;transform-origin:center}
.spin{transition:transform 1.1s cubic-bezier(.4,.1,.2,1)}
.tilt{transition:transform .7s cubic-bezier(.3,.6,.3,1.3)}
.lvl{transition:all .7s ease}
@keyframes pop{from{opacity:0;transform:scale(.3)}}
@keyframes fade{from{opacity:0;transform:translateY(10px)}}
@keyframes drop{from{opacity:0;transform:translateY(-50px)}}
@keyframes grow{from{transform:scaleX(0)}}
@keyframes rise{from{transform:scaleY(0)}}
@keyframes bob{50%{transform:translateY(-5px)}}
@keyframes wig{25%{transform:rotate(-6deg)}75%{transform:rotate(6deg)}}
.conf{animation:conf 1.4s ease-in forwards;transform-box:fill-box;transform-origin:center}
@keyframes conf{to{transform:translate(var(--dx),var(--dy)) rotate(var(--r));opacity:0}}
@media (prefers-reduced-motion: reduce){ .a-pop,.a-fade,.a-drop,.a-grow,.a-rise,.a-bob,.a-wig,.conf{animation:none} .spin,.tilt,.lvl{transition:none} }
</style></head><body>
<a href="../index.html" style="position:fixed;top:10px;right:12px;z-index:50;font:700 13px/1 system-ui,sans-serif;color:#1F3A4A;background:#fff;border:2px solid #1F3A4A;border-radius:999px;padding:7px 12px;text-decoration:none;box-shadow:0 2px 0 #1F3A4A">&#8592; Hub</a>


<div class="wrap">
  <header>
    <div>
      <p class="eyebrow">Primary 2 English · Deck 1</p>
      <h1>Nouns &amp; articles</h1>
    </div>
    <div class="starpill" id="starpill" title="Stars earned"><svg viewBox="0 0 40 40" aria-hidden="true"><path d="M20 3l5 11 12 1.3-9 8 2.7 12L20 29l-10.7 6.3L12 23.3l-9-8L15 14z" fill="#FFC83D" stroke="#1F3A4A" stroke-width="3" stroke-linejoin="round"/></svg><span id="starcount">0</span></div>
  </header>
  <nav class="parts" aria-label="Parts">
    <button type="button" data-part="learn">Learn</button>
    <button type="button" data-part="try">Try it!</button>
    <button type="button" data-part="check">Star check</button>
  </nav>
  <section class="stage" aria-live="polite">
    <div class="scene-head"><span class="tag" id="tag"></span><h2 id="title"></h2></div>
    <svg id="stage" viewBox="0 0 640 400" role="img"></svg>
    <div class="ui" id="ui"></div>
    <div class="talk"><svg viewBox="0 0 100 100" aria-hidden="true" id="face"></svg><div class="bubble" id="say"></div></div>
  </section>
  <div class="controls">
    <button id="prev" type="button">Back</button>
    <div class="dots" id="dots" role="group" aria-label="Slides"></div>
    <button id="read" type="button" class="rd" aria-pressed="false" title="Read the words aloud">🔊 <span>Read to me</span></button>
    <button id="replay" type="button">Replay</button>
    <button id="next" type="button" class="primary">Next</button>
  </div>
  <p class="foot">Primary 2 English, following the MOE English Language Syllabus (STELLAR). Use the arrow keys or the big buttons to move around.</p>
</div>

<script>
/* ---------- drawing helpers ---------- */
const C={ink:'#1F3A4A',paper:'#FFFDF6',accent:'#FF7A45',sun:'#FFC83D',sky:'#5BB8E8',leaf:'#4FAE63',berry:'#E5577A',grape:'#8E6BD8',muted:'#58707D',line:'#B7D8CF',good:'#3EA45A',bad:'#E0574F'};
const T=(x,y,s,cls='lab',ex='')=>`<text x="${x}" y="${y}" class="${cls}" ${ex}>${s}</text>`;
const G=(inner,cls='',d=0,ex='')=>`<g class="${cls}" style="--d:${d}s" ${ex}>${inner}</g>`;
function otter(x,y,s=1,o={}){ // origin = feet centre; about 110 tall at s=1
  const wave=o.wave?`<path d="M30 -58 q16 -14 12 -32" stroke="${C.ink}" stroke-width="3" fill="#9A6A45" stroke-linecap="round"/><ellipse cx="42" cy="-92" rx="8" ry="9" fill="#9A6A45" stroke="${C.ink}" stroke-width="3"/>`:`<ellipse cx="26" cy="-48" rx="8" ry="12" fill="#9A6A45" stroke="${C.ink}" stroke-width="3" transform="rotate(-25 26 -48)"/>`;
  return `<g transform="translate(${x} ${y}) scale(${s})"><g class="${o.still?'':'a-bob'}">
  <path d="M-30 -10 q-40 6 -44 -24 q14 14 40 4z" fill="#82552F" stroke="${C.ink}" stroke-width="3" stroke-linejoin="round"/>
  <ellipse cx="0" cy="-36" rx="34" ry="38" fill="#9A6A45" stroke="${C.ink}" stroke-width="3"/>
  <ellipse cx="0" cy="-30" rx="21" ry="27" fill="#F2DDBE"/>
  <ellipse cx="-16" cy="-2" rx="12" ry="7" fill="#82552F" stroke="${C.ink}" stroke-width="3"/><ellipse cx="16" cy="-2" rx="12" ry="7" fill="#82552F" stroke="${C.ink}" stroke-width="3"/>
  <ellipse cx="-26" cy="-48" rx="8" ry="12" fill="#9A6A45" stroke="${C.ink}" stroke-width="3" transform="rotate(25 -26 -48)"/>${wave}
  <circle cx="-27" cy="-100" r="9" fill="#9A6A45" stroke="${C.ink}" stroke-width="3"/><circle cx="27" cy="-100" r="9" fill="#9A6A45" stroke="${C.ink}" stroke-width="3"/>
  <circle cx="0" cy="-86" r="32" fill="#9A6A45" stroke="${C.ink}" stroke-width="3"/>
  <ellipse cx="0" cy="-74" rx="22" ry="15" fill="#F2DDBE"/>
  <circle cx="-13" cy="-92" r="5.5" fill="${C.ink}"/><circle cx="13" cy="-92" r="5.5" fill="${C.ink}"/>
  <circle cx="-11" cy="-94" r="2" fill="#fff"/><circle cx="15" cy="-94" r="2" fill="#fff"/>
  <ellipse cx="-22" cy="-78" rx="6" ry="3.5" fill="#F4A3A8"/><ellipse cx="22" cy="-78" rx="6" ry="3.5" fill="#F4A3A8"/>
  <path d="M-6 -81 q6 -5 12 0 q-6 7 -12 0z" fill="${C.ink}"/>
  <path d="M-6 -71 q6 6 12 0" stroke="${C.ink}" stroke-width="2.5" fill="none" stroke-linecap="round"/>
  <path d="M-12 -78 l-18 -3 M-12 -75 l-18 2 M12 -78 l18 -3 M12 -75 l18 2" stroke="${C.ink}" stroke-width="1.5" stroke-linecap="round"/>
  </g></g>`;
}
function bubble(x,y,w,h,txt,cls='lab'){ // speech bubble pointing down-left
  return `<g><path d="M${x} ${y} h${w} a14 14 0 0 1 14 14 v${h-28} a14 14 0 0 1 -14 14 h${-w+40} l-22 18 l4 -18 h-${18} a14 14 0 0 1 -14 -14 v${-(h-28)} a14 14 0 0 1 14 -14z" fill="#fff" stroke="${C.ink}" stroke-width="3"/>${T(x+w/2+7,y+h/2+7,txt,cls+' mid')}</g>`;
}
function star(x,y,r=16,fill=C.sun){const p=[];for(let k=0;k<10;k++){const a=-Math.PI/2+k*Math.PI/5,rr=k%2?r*.45:r;p.push((x+rr*Math.cos(a)).toFixed(1)+','+(y+rr*Math.sin(a)).toFixed(1))}
  return `<polygon points="${p.join(' ')}" fill="${fill}" stroke="${C.ink}" stroke-width="2.5" stroke-linejoin="round"/>`}
const box=(x,y,w,h,fill='#fff',r=12,ex='')=>`<rect x="${x}" y="${y}" width="${w}" height="${h}" rx="${r}" fill="${fill}" stroke="${C.ink}" stroke-width="3" ${ex}/>`;
const arrow=(x1,y1,x2,y2,col=C.ink)=>{const a=Math.atan2(y2-y1,x2-x1),h=12;return `<path d="M${x1} ${y1} L${x2} ${y2} M${x2-h*Math.cos(a-.5)} ${y2-h*Math.sin(a-.5)} L${x2} ${y2} L${x2-h*Math.cos(a+.5)} ${y2-h*Math.sin(a+.5)}" stroke="${col}" stroke-width="4" fill="none" stroke-linecap="round" stroke-linejoin="round"/>`};

/* ---------- engine ---------- */
const PARTS={learn:'Learn',try:'Try it!',check:'Star check'};
let i=0, earned=new Set(), reading=false, timers=[];
const $=id=>document.getElementById(id);
const svg=$('stage'), ui=$('ui'), sayEl=$('say');
$('face').innerHTML=otter(50,112,.86,{still:true});
function speak(t){ if(!reading) return; try{ speechSynthesis.cancel(); const u=new SpeechSynthesisUtterance(t.replace(/<[^>]+>/g,'').replace(/ℓ/g,' litres').replace(/\bkg\b/g,'kilograms').replace(/\bmin\b/g,'minutes')); u.rate=.92; u.pitch=1.1; const v=speechSynthesis.getVoices().find(v=>/en[-_](SG|GB|AU)/i.test(v.lang))||speechSynthesis.getVoices().find(v=>/^en/i.test(v.lang)); if(v) u.voice=v; speechSynthesis.speak(u);}catch(e){} }
function say(t){ sayEl.innerHTML=t; speak(t); }
function later(fn,ms=60){ timers.push(setTimeout(fn,ms)); }
function confetti(){ const cols=[C.sun,C.accent,C.sky,C.leaf,C.berry,C.grape]; let s='';
  for(let k=0;k<34;k++){const x=320+(Math.random()-.5)*80,y=170, dx=(Math.random()-.5)*640, dy=(Math.random()*.9-.55)*420;
    s+=`<rect class="conf" x="${x}" y="${y}" width="10" height="14" rx="2" fill="${cols[k%6]}" style="--dx:${dx}px;--dy:${dy}px;--r:${Math.random()*720}deg"/>`}
  const g=document.createElementNS('http://www.w3.org/2000/svg','g'); g.innerHTML=s+`<g class="a-pop">${star(320,120,46)}</g>`; svg.appendChild(g); later(()=>g.remove(),1600); }
function win(msg){ if(!earned.has(i)){earned.add(i); $('starcount').textContent=earned.size; const p=$('starpill'); p.classList.remove('bump'); void p.offsetWidth; p.classList.add('bump');} confetti(); if(msg) say(msg); drawDots(); }
const api={svg,ui,say,win,later,confetti,q:s=>svg.querySelector(s),qa:s=>svg.querySelectorAll(s),
  btn(label,fn,cls=''){const b=document.createElement('button');b.type='button';b.innerHTML=label;if(cls)b.className=cls;b.onclick=()=>fn(b);ui.appendChild(b);return b;}};
function mountQuiz(sc){ const qz=sc.quiz; let done=false;
  qz.options.forEach(o=>api.btn(o,b=>{ if(done) return;
    if(o===qz.answer){done=true;b.classList.add('ok');[...ui.children].forEach(x=>x.disabled=true);win('<b>Yes!</b> '+qz.why); if(qz.after) qz.after(api);}
    else{b.classList.remove('no');void b.offsetWidth;b.classList.add('no');say('<b>Not quite.</b> '+qz.hint);} })); }
function render(){
  timers.forEach(clearTimeout); timers=[]; try{speechSynthesis.cancel()}catch(e){}
  const sc=S[i]; $('tag').textContent=PARTS[sc.part]; $('tag').className='tag '+sc.part; $('title').textContent=sc.title;
  svg.innerHTML=sc.draw?sc.draw(api):''; ui.innerHTML=''; say(sc.say);
  if(sc.quiz) mountQuiz(sc); if(sc.mount) sc.mount(api);
  document.querySelectorAll('.parts button').forEach(b=>b.setAttribute('aria-current', b.dataset.part===sc.part));
  $('prev').disabled=i===0; $('next').disabled=i===S.length-1; drawDots();
}
function drawDots(){ const d=$('dots'); d.innerHTML=''; S.forEach((s,k)=>{const b=document.createElement('button');b.type='button';b.className=s.part+(earned.has(k)?' done':'');
  b.setAttribute('aria-label',`Slide ${k+1}: ${s.title}`); if(k===i) b.setAttribute('aria-current','true'); b.onclick=()=>{i=k;render()}; d.appendChild(b)}); }
function go(k){ if(k<0||k>=S.length) return; i=k; render(); window.scrollTo({top:0,behavior:'smooth'}); }
$('prev').onclick=()=>go(i-1); $('next').onclick=()=>go(i+1); $('replay').onclick=render;
$('read').onclick=e=>{reading=!reading; e.currentTarget.setAttribute('aria-pressed',reading); if(reading) speak(sayEl.innerHTML); else try{speechSynthesis.cancel()}catch(x){}};
document.querySelectorAll('.parts button').forEach(b=>b.onclick=()=>go(S.findIndex(s=>s.part===b.dataset.part)));
document.addEventListener('keydown',e=>{ if(e.target.closest&&e.target.closest('button')&&e.key===' ') return; if(e.key==='ArrowRight') go(i+1); if(e.key==='ArrowLeft') go(i-1); });

/* ---------- deck ---------- */
/* shared English helpers: word tokens, sentences, speech bubbles */
const CW=11.5; // approx px per char at 20px Baloo
function measure(w,size=20){return w.length*CW*size/20+size*.9}
/* lay out words as tokens; returns {svg, boxes} ; opts: size, maxW, tap(index)->bool, hi:{idx:color}, fill */
function sentence(x,y,words,{size=20,maxW=600,tap=null,hi={},pad=8,lineH=null,cls='',fillDefault='#fff'}={}){
  const lh=lineH||size*2.2;let cx=x,cy=y,svg='';const boxes=[];
  words.forEach((w,i)=>{const bw=measure(w,size);if(cx+bw>x+maxW){cx=x;cy+=lh}
    const isTap=tap&&tap(i,w),fill=hi[i]||fillDefault,stroke=hi[i]?C.ink:'#C9D3CE';
    svg+=`<g class="${isTap?'tap tok':'tok'} ${cls}" data-i="${i}"><rect x="${cx}" y="${cy-size*1.1}" width="${bw}" height="${size*1.7}" rx="${size*.4}" fill="${fill}" stroke="${stroke}" stroke-width="2"/><text x="${cx+bw/2}" y="${cy+size*.18}" class="mid" style="font-size:${size}px;font-weight:700">${w}</text></g>`;
    boxes.push({x:cx,y:cy,w:bw});cx+=bw+pad});
  return {svg,boxes,endY:cy}}
/* plain wrapped sentence text (no boxes) */
function prose(x,y,str,max=50,cls='lab',lh=28,ex=''){const w=str.split(' '),L=[];let c='';w.forEach(t=>{if((c+' '+t).trim().length>max){L.push(c);c=t}else c=(c+' '+t).trim()});L.push(c);return L.map((l,k)=>T(x,y+k*lh,l,cls,ex)).join('')}
const speech=(x,y,w,h,txt,size=18,max=30)=>`<g><rect x="${x}" y="${y}" width="${w}" height="${h}" rx="18" fill="#fff" stroke="${C.ink}" stroke-width="3"/><path d="M${x+40} ${y+h} l-8 20 l26 -20z" fill="#fff" stroke="${C.ink}" stroke-width="3"/><rect x="${x+34}" y="${y+h-3}" width="26" height="6" fill="#fff"/>${prose(x+18,y+34,txt,max,'lab',size*1.35,`style="font-size:${size}px"`)}</g>`;
const tagPill=(x,y,txt,col=C.sky,w=null)=>{const ww=w||measure(txt,15)+10;return `<rect x="${x}" y="${y}" width="${ww}" height="28" rx="14" fill="${col}"/>`+T(x+ww/2,y+19,txt,'sm mid','style="fill:#fff;font-weight:800"')};
const blank=(x,y,w=70)=>`<line x1="${x}" y1="${y+6}" x2="${x+w}" y2="${y+6}" stroke="${C.accent}" stroke-width="3"/>`;

2:[chat('Chat: Wala learns tenses',[['wala','Chowdie! Yesterday I go to the park!',''],['otter','Ooh! Say "yesterday I WENT to the park".',''],['wala','Went? Why not go?','我昨天去了公园。'],['otter','Yesterday is the past. Go becomes went!','']],WL+'In Chinese, verbs don\'t change for past or present. We just add words like 昨天 (yesterday) or 了. In English the verb itself changes. Go, went! Eat, ate! That\'s a lot to remember!'),
 [{say:'Yesterday I go to the zoo.',sub:'昨天我去了动物园。',options:['Yesterday I went to the zoo.','Yesterday I go to the zoo.','Yesterday I goed to the zoo.'],answer:'Yesterday I went to the zoo.',why:'Yesterday is the past, and go becomes went.',hint:'It happened yesterday. What is the past of "go"?'},
  {say:'My brother like bananas.',sub:'我哥哥喜欢香蕉。',options:['My brother likes bananas.','My brother like bananas.','My brother liking bananas.'],answer:'My brother likes bananas.',why:'With he, she or one person, add -s: he likes.',hint:'My brother = he. He like, or he likes?'},
  {say:'Look! I am eat now.',sub:'看！我在吃东西。',options:['Look! I am eating now.','Look! I am eat now.','Look! I eat now am.'],answer:'Look! I am eating now.',why:'Happening right now: am + -ing. I am eating.',hint:'It\'s happening now. Which ending goes with "am"?'},
  {say:'Tomorrow I will went to school.',sub:'明天我会去学校。',options:['Tomorrow I will go to school.','Tomorrow I will went to school.','Tomorrow I will going to school.'],answer:'Tomorrow I will go to school.',why:'After "will", use the plain verb: will go.',hint:'"Will" + the simple verb.'}],
 [{wala:'What did you do last weekend?',options:['I played football with my friends.','I play football tomorrow.','I playing football.'],answer:'I played football with my friends.',reply:'You played football! Played: past tense, I hear it!'},
  {wala:'What are you doing now?',options:['I am reading a book.','I read a book yesterday.','I am read book.'],answer:'I am reading a book.',reply:'Reading right now. Am reading!'},
  {wala:'What will you do tomorrow?',options:['I will visit my grandma.','I visited my grandma.','I will visited grandma.'],answer:'I will visit my grandma.',reply:'Will visit. Tomorrow is the future!'}]],
3:[chat('Chat: Wala describes things',[['wala','My kite is more high than your kite!',''],['otter','We say "higher"! Short words add -er.',''],['wala','My kite is higher! 我的风筝更高！',''],['otter','But mine is the highest! Hehe!','']],WL+'In Chinese I just put 更 (more) or 最 (most) in front: 更高, 最高. In English, short words change their ending: high, higher, highest. Long words use more and most. I\'m learning!'),
 [{say:'The elephant is more big than the cat.',sub:'大象比猫大。',options:['The elephant is bigger than the cat.','The elephant is more big than the cat.','The elephant is biggest than the cat.'],answer:'The elephant is bigger than the cat.',why:'Big is a short word: big, bigger (double the g!).',hint:'Short words add -er instead of "more".'},
  {say:'This is the goodest cake ever!',sub:'这是最好吃的蛋糕！',options:['This is the best cake ever!','This is the goodest cake ever!','This is the most good cake ever!'],answer:'This is the best cake ever!',why:'Good is a rebel: good, better, best.',hint:'Good is a rebel word. Good, better, …?'},
  {say:'The tortoise walks very slow.',sub:'乌龟走得很慢。',options:['The tortoise walks very slowly.','The tortoise walks very slow.','The tortoise slow walks.'],answer:'The tortoise walks very slowly.',why:'To describe HOW it walks, add -ly: slowly.',hint:'How does it walk? Adverbs often end in -ly.'},
  {say:'The cat is in the table.',sub:'猫在桌子上。',options:['The cat is on the table.','The cat is in the table.','The cat is at table.'],answer:'The cat is on the table.',why:'On top of something is "on". "In" means inside.',hint:'Is the cat inside the table, or on top?'}],
 [{wala:'What does durian smell like?',options:['It smells strong and stinky!','It smell good very.','Durian.'],answer:'It smells strong and stinky!',reply:'Strong and stinky! Haha, that\'s true!'},
  {wala:'Where is my water bottle?',options:['It is under your chair.','It under chair.','Water bottle is.'],answer:'It is under your chair.',reply:'Under my chair! Found it, thank you!'},
  {wala:'How did the cheetah run?',options:['It ran very quickly.','It ran very quick.','It quickly very ran.'],answer:'It ran very quickly.',reply:'Very quickly! Quick plus -ly!'}]],
4:[chat('Chat: he or she?',[['wala','In Chinese, 他 and 她 both sound like tā!',''],['otter','In English they sound different: he and she.',''],['wala','So my mum… he is kind?','我妈妈很善良。'],['otter','Mum is a girl, so: SHE is kind!','']],WL+'他 (he) and 她 (she) sound exactly the same in Chinese: tā! So I often mix up he and she in English. Chowdie says: boys and men are "he", girls and women are "she", and things are "it".'),
 [{say:'My mum is a teacher. He is very kind.',sub:'我妈妈是老师。她很善良。',options:['My mum is a teacher. She is very kind.','My mum is a teacher. He is very kind.','My mum is a teacher. It is very kind.'],answer:'My mum is a teacher. She is very kind.',why:'Mum is a woman, so use "she".',hint:'Is Mum a he or a she?'},
  {say:'Please give the book to I.',sub:'请把书给我。',options:['Please give the book to me.','Please give the book to I.','Please give I the book to.'],answer:'Please give the book to me.',why:'After "to", use "me", not "I".',hint:'I do things; things are given to …?'},
  {say:'This are my new shoes.',sub:'这是我的新鞋子。',options:['These are my new shoes.','This are my new shoes.','This is my new shoes.'],answer:'These are my new shoes.',why:'Shoes are more than one, so: these are.',hint:'One thing: this is. Many things: …?'},
  {say:'I was tired, but I went to bed.',sub:'我很累，所以我去睡觉。',options:['I was tired, so I went to bed.','I was tired, but I went to bed.','I was tired, or I went to bed.'],answer:'I was tired, so I went to bed.',why:'"So" shows what happened because of the reason, just like 所以!',hint:'Going to bed is the result. Which joining word means 所以?'}],
 [{wala:'Is this your pencil?',options:['No, it\'s Mei\'s. It belongs to her.','No, it\'s him pencil.','No, she pencil.'],answer:'No, it\'s Mei\'s. It belongs to her.',reply:'It belongs to her. Her pencil! Got it.'},
  {wala:'Who is that boy?',options:['He is my brother, Arjun.','She is my brother.','Him is my brother.'],answer:'He is my brother, Arjun.',reply:'A boy is "he". He is your brother!'},
  {wala:'Can you help me carry these books?',options:['Yes, I can help you.','Yes, me can help you.','Yes, I can help I.'],answer:'Yes, I can help you.',reply:'Thank you! You are so kind!'}]],
5:[chat('Chat: full stops and question marks',[['wala','In Chinese, our full stop is a circle: 。',''],['otter','In English it is a little dot: .',''],['wala','And English questions end with ? too!','你叫什么名字？'],['otter','Yes! And every sentence starts with a capital.','']],WL+'Chinese has no capital letters at all! And our full stop is a tiny circle 。, and our comma looks like this: ，. So in English I sometimes forget capitals, or I write 。 instead of a dot!'),
 [{say:'I like apples。',sub:'我喜欢苹果。',options:['I like apples.','I like apples。','I like apples,'],answer:'I like apples.',why:'English full stops are a little dot, not a circle.',hint:'Look at the mark at the end.'},
  {say:'where is my bag.',sub:'我的书包在哪里？',options:['Where is my bag?','where is my bag.','Where is my bag.'],answer:'Where is my bag?',why:'A capital letter to start, and a question mark for a question.',hint:'Two things: the start and the end!'},
  {say:'I bought eggs milk and bread.',sub:'我买了鸡蛋、牛奶和面包。',options:['I bought eggs, milk and bread.','I bought eggs milk and bread.','I bought, eggs, milk, and, bread.'],answer:'I bought eggs, milk and bread.',why:'Use commas between things in a list (Chinese uses 、 here).',hint:'Separate the list items.'},
  {say:'Lets play together!',sub:'我们一起玩吧！',options:['Let\'s play together!','Lets play together!','Let\'s play together.'],answer:'Let\'s play together!',why:'Let\'s is short for "let us", so it needs an apostrophe.',hint:'Lets = let us squeezed together. What mark shows the missing letter?'}],
 [{wala:'Is your birthday in May?',options:['Yes, it is on 5 May.','yes it is on 5 may','Yes it is on 5 may'],answer:'Yes, it is on 5 May.',reply:'Capital Y, a comma, capital M for May, and a full stop. Perfect!'},
  {wala:'Do you like durian?',options:['No, I don\'t like durian!','no i dont like durian','No, I dont like durian!'],answer:'No, I don\'t like durian!',reply:'Don\'t, with an apostrophe. And capital I!'},
  {wala:'What did your teacher say?',options:['She said, "Please sit down."','She said please sit down.','she said "please sit down"'],answer:'She said, "Please sit down."',reply:'Speech marks around the words she said. Got it!'}]],
6:[chat('Chat: open the light?',[['wala','Chowdie, it\'s dark! Please open the light!','请开灯！'],['otter','Haha! In English we "switch on" the light.',''],['wala','So "open" is not for lights?',''],['otter','"Open" is for doors and boxes. Lights are switched on!','']],WL+'In Chinese we say 开灯 (open light) and 关电视 (close TV). But English uses different words: switch on the light, turn off the TV. These are phrasal verbs. Lots of Singapore kids mix them up too!'),
 [{say:'Please open the light.',sub:'请开灯。',options:['Please switch on the light.','Please open the light.','Please open on the light.'],answer:'Please switch on the light.',why:'Lights are switched on or turned on, not opened.',hint:'What do you do to a light switch?'},
  {say:'Can you close the TV?',sub:'你可以关电视吗？',options:['Can you turn off the TV?','Can you close the TV?','Can you close off the TV?'],answer:'Can you turn off the TV?',why:'TVs and lights are turned off or switched off.',hint:'You close doors. TVs are turned …?'},
  {say:'I very like ice cream.',sub:'我很喜欢冰淇淋。',options:['I like ice cream very much.','I very like ice cream.','I like very ice cream.'],answer:'I like ice cream very much.',why:'In English, "very much" goes at the end: I like it very much.',hint:'Where does "very much" go in English?'},
  {say:'The opposite of happy is angry.',sub:'开心的反义词是难过。',options:['The opposite of happy is sad.','The opposite of happy is angry.','The opposite of happy is glad.'],answer:'The opposite of happy is sad.',why:'Happy ↔ sad are antonyms. Glad means the same as happy: a synonym!',hint:'开心 ↔ 难过. Which English word is 难过?'}],
 [{wala:'It\'s so dark in here!',options:['Let me switch on the light.','Let me open the light.','Light is dark.'],answer:'Let me switch on the light.',reply:'Switch on the light. Thank you! Now I can see!'},
  {wala:'I\'m so tired after PE.',options:['You should sit down and take a rest.','You should open the rest.','Tired is big.'],answer:'You should sit down and take a rest.',reply:'Take a rest. Good idea!'},
  {wala:'This bag is very heavy!',options:['Let me pick it up for you.','Let me pick up it for you.','Bag heavy you.'],answer:'Let me pick it up for you.',reply:'Pick it up! You\'re a good friend, Chowdie!'}]],
7:[chat('Chat: reading together',[['wala','I read a story, but I don\'t understand it all.',''],['otter','Let\'s be detectives! Ask who, what, where…',''],['wala','Who? Mei! Where? On the way home!','谁？在哪里？'],['otter','Great detective work! Now: why?','']],WL+'Reading in English is hard for me, so Chowdie taught me to ask questions: who, what, where, when, why and how. It\'s just like 看图说话 in Chinese: 谁、什么时候、在哪里、做什么!'),
 [{story:'Mei forgot her umbrella. On the way home, it rained. Her mum gave her a towel and hot soup. Mei smiled.',say:'Why was Mei wet? Because she went swimming!',options:['Because it rained and she had no umbrella.','Because she went swimming.','Because she drank water.'],answer:'Because it rained and she had no umbrella.',why:'The clues are in the story: no umbrella + rain = wet!',hint:'Look for the clues in the story.'},
  {story:'Mei forgot her umbrella. On the way home, it rained. Her mum gave her a towel and hot soup. Mei smiled.',say:'Who gave Mei a towel? Her teacher!',options:['Her mum gave her a towel.','Her teacher gave her a towel.','Mei gave her mum a towel.'],answer:'Her mum gave her a towel.',why:'The story says "her mum", so the answer is her mum.',hint:'Read the sentence again: who gave the towel?'},
  {story:'Mei forgot her umbrella. On the way home, it rained. Her mum gave her a towel and hot soup. Mei smiled.',say:'How did Mei feel? Angry!',options:['She felt warm and happy.','She felt angry.','She felt hungry and sad.'],answer:'She felt warm and happy.',why:'She smiled and had hot soup, so she felt warm and happy.',hint:'What does smiling tell you?'}],
 [{wala:'What is the story about?',options:['It\'s about Mei getting caught in the rain.','It\'s about a towel.','Mei.'],answer:'It\'s about Mei getting caught in the rain.',reply:'The big idea: Mei and the rain! Thank you!'},
  {wala:'Why did Mum give Mei hot soup?',options:['To warm her up after the rain.','Because soup is red.','Mum hungry.'],answer:'To warm her up after the rain.',reply:'To warm her up. That\'s reading between the lines!'},
  {wala:'What should Mei do next time?',options:['She should bring her umbrella.','She should go swimming.','Next time is Tuesday.'],answer:'She should bring her umbrella.',reply:'Bring an umbrella! 带雨伞！'}]],
8:[chat('Chat: Wala writes a recount',[['wala','Can you check my story? "I go beach. I swim."',''],['otter','It happened yesterday, so: I went to the beach.',''],['wala','And then? 然后？',''],['otter','Use First, Next, Then and Finally!','']],WL+'I\'m writing my first English story! Chowdie says a recount tells what happened in order, uses past tense, and starts with when and where. It\'s like 先…然后…最后… in Chinese!'),
 [{say:'yesterday I go to the beach.',sub:'昨天我去了海边。',options:['Yesterday, I went to the beach.','yesterday I go to the beach.','Yesterday I go to the beach.'],answer:'Yesterday, I went to the beach.',why:'A capital letter to start, and past tense: went.',hint:'Two fixes: the first letter and the verb.'},
  {say:'First I swim. Then I eat. Then I go home.',sub:'',options:['First, I swam. Next, I ate lunch. Finally, I went home.','First I swim. Then I eat. Then I go home.','Finally I swam. First I ate.'],answer:'First, I swam. Next, I ate lunch. Finally, I went home.',why:'Past tense, plus sequencing words: First, Next, Finally.',hint:'Past tense AND good order words.'},
  {say:'The sea was nice.',sub:'海很漂亮。',options:['The sea was sparkling blue and the waves splashed my feet.','The sea was nice nice.','Sea nice.'],answer:'The sea was sparkling blue and the waves splashed my feet.',why:'Use your senses to show, not just tell!',hint:'Which one helps you see and feel it?'}],
 [{wala:'How do I start my story?',options:['Start with when and where: Last Saturday, I went to the beach.','Start with The End.','Start with a question mark.'],answer:'Start with when and where: Last Saturday, I went to the beach.',reply:'When and where first. Like 什么时候、在哪里!'},
  {wala:'How do I end my story?',options:['Say how you felt: I felt tired but happy.','Stop in the middle.','Write the title again.'],answer:'Say how you felt: I felt tired but happy.',reply:'End with feelings, like 心情怎样!'},
  {wala:'What do I do after I finish writing?',options:['Check it: capitals, full stops and spelling.','Throw it away.','Write it in Chinese.'],answer:'Check it: capitals, full stops and spelling.',reply:'Check like a pro! Thank you, teacher Chowdie!'}]],
9:[chat('Chat: Wala practises Show and Tell',[['wala','I\'m nervous! I must talk in front of the class.','我有点紧张。'],['otter','You can do it! Speak loudly and slowly.',''],['wala','And look at my friends, not the floor?',''],['otter','Yes! And smile. Tell them who, what, where, why!','']],WL+'Tomorrow is my first English Show and Tell! I\'m bringing my eucalyptus leaf. Chowdie helped me plan: say what it is, where I got it, and why I like it. And be polite when friends ask questions!'),
 [{say:'Give me water!',sub:'请给我水。',options:['May I have some water, please?','Give me water!','Water! Now!'],answer:'May I have some water, please?',why:'"May I… please?" is the polite way to ask.',hint:'Which one has the magic word?'},
  {say:'What?',sub:'(when you didn\'t hear)',options:['Pardon? Could you say that again, please?','What?','Huh? Say again!'],answer:'Pardon? Could you say that again, please?',why:'"Pardon?" is polite when you didn\'t hear.',hint:'Which one is polite?'},
  {say:'Stop talking! My turn!',sub:'',options:['Excuse me, may I say something?','Stop talking! My turn!','Be quiet, I talk now.'],answer:'Excuse me, may I say something?',why:'Wait for a pause and say "Excuse me".',hint:'How do you politely join a conversation?'},
  {say:'Bye.',sub:'(to Mrs Tan, the teacher)',options:['Goodbye, Mrs Tan. Thank you!','Bye.','See you, Tan.'],answer:'Goodbye, Mrs Tan. Thank you!',why:'Use the teacher\'s name and say thank you.',hint:'How do you say goodbye nicely to a teacher?'}],
 [{wala:'This is my eucalyptus leaf. I eat it every day!',options:['Wow! Where do you get your leaves?','Boring.','I don\'t care.'],answer:'Wow! Where do you get your leaves?',reply:'From the tree near my house! Thank you for asking!'},
  {wala:'Do you have a question for me?',options:['Yes! Why do you like eucalyptus leaves?','No. Sit down.','Leaf leaf leaf.'],answer:'Yes! Why do you like eucalyptus leaves?',reply:'Because they\'re yummy and smell fresh! Good question!'},
  {wala:'How did I do?',options:['You spoke clearly and smiled. Well done!','You were bad.','Next!'],answer:'You spoke clearly and smiled. Well done!',reply:'Thank you, Chowdie! I feel brave now!'}]]};
